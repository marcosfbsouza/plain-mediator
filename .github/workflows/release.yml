name: Release

# Publica no nuget.org quando uma tag de versão é enviada:
#   git tag v1.0.0 && git push origin v1.0.0
# O MinVer transforma a tag na versão do pacote, então a tag é a única fonte da verdade.
#
# A autenticação usa Trusted Publishing (OIDC): o GitHub prova a identidade deste workflow
# e o nuget.org devolve uma chave válida por 1 hora. Não há API key guardada em secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: nuget # precisa bater com o campo Environment da policy no nuget.org

    permissions:
      contents: read
      id-token: write # emite o token OIDC que o nuget.org valida

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build PlainMediator.slnx -c Release

      - name: Test
        run: dotnet test PlainMediator.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack src/PlainMediator/PlainMediator.csproj -c Release --no-build

      # A chave temporária vale 1 hora, por isso é pedida só depois do build passar.
      - name: Login no nuget.org (OIDC -> chave temporária)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }} # nome de perfil no nuget.org, não o e-mail

      - name: Push para o nuget.org
        run: |
          dotnet nuget push "artifacts/packages/*.nupkg" \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
